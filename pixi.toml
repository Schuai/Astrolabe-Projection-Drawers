[workspace]
name = "geared-astrolabe"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.12,<3.14"
numpy = ">=2.0,<3.0"
opencv = ">=4.10,<5.0"
pyside6 = ">=6.8,<7"
astropy = ">=7,<8"

[tasks]
draw-azimuthal-equidistant = "python scripts/draw_azimuthal_equidistant.py"
draw-stereographic = "python scripts/draw_stereographic.py"
perspective-correct = "python scripts/perspective_corrector.py"
gui = "python scripts/astrolabe_gui.py"
draw-star-chart = "python scripts/draw_star_chart.py"
download-star-data = "python scripts/download_star_data.py"
